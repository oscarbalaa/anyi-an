<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Arial}text{font-family:Arial}</style></head><body>
<svg id="lienzo" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const P=new URLSearchParams(location.search);
const actor=P.get('a'), cus=JSON.parse(P.get('c'));
const svg=document.getElementById('lienzo'); const rowH=46, arriba=60, W=820;
const H=arriba+cus.length*rowH+30; svg.setAttribute('width',W); svg.setAttribute('height',H);
function el(n,a,t){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);if(t)e.textContent=t;svg.appendChild(e);return e;}
el('rect',{x:240,y:20,width:560,height:H-30,fill:'none',stroke:'#333','stroke-width':1.5});
el('text',{x:255,y:42,'font-size':15,'font-weight':'bold'},'AYNI');
const ay=arriba+(cus.length-1)*rowH/2, ax=100;
cus.forEach((c,i)=>{const y=arriba+i*rowH+10; el('line',{x1:ax+22,y1:ay-10,x2:330,y2:y,stroke:'#555'});});
cus.forEach((c,i)=>{const y=arriba+i*rowH+10; el('ellipse',{cx:520,cy:y,rx:190,ry:19,fill:'#f4f8fb',stroke:'#2f5d8a','stroke-width':1.3}); el('text',{x:520,y:y+4,'text-anchor':'middle','font-size':12.5},c);});
const x=ax,y=ay; el('circle',{cx:x,cy:y-30,r:9,fill:'#fff',stroke:'#222','stroke-width':1.5});
[[x,y-21,x,y+2],[x-14,y-12,x+14,y-12],[x,y+2,x-11,y+20],[x,y+2,x+11,y+20]].forEach(l=>el('line',{x1:l[0],y1:l[1],x2:l[2],y2:l[3],stroke:'#222','stroke-width':1.5}));
el('text',{x:x,y:y+38,'text-anchor':'middle','font-size':13.5,'font-weight':'bold'},actor);
</script></body></html>
