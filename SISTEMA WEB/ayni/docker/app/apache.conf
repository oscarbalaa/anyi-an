# La raíz del sitio es la raíz del proyecto, igual que la carpeta grupo02 del hosting.
# Así el .htaccess que se prueba en local es el mismo que se sube por FTP.
<VirtualHost *:80>
    DocumentRoot /var/www/ayni

    <Directory /var/www/ayni>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
