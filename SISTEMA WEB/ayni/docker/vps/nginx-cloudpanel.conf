# AYNI en un VPS con CloudPanel (Nginx). Hace lo mismo que backend/public/.htaccess.
# En CloudPanel: sitio de AYNI → Vhost. Reemplaza el bloque que dice
#     location / {
#       try_files $uri $uri/ /index.php?$args;
#     }
# por todo lo de abajo y pulsa Save. El resto del Vhost queda igual.
# La raíz del sitio debe ser backend/public (Settings → Root Directory), así lo privado queda fuera de la web.

  index index.html;

  # API → Laravel (pone sus propias cabeceras de seguridad: CabecerasSeguridad)
  location ^~ /api {
    try_files $uri /index.php?$query_string;
  }

  # React: un archivo real o la pantalla (index.html), que nunca se guarda en caché
  location / {
    try_files $uri /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }

  # Nada que empiece con punto (.env, .htaccess, .git)
  location ~ /\.(?!well-known) {
    deny all;
  }
